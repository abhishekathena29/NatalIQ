<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fraunces;src:url(Fraunces.ttf)}
@font-face{font-family:Nunito;src:url(Nunito.ttf)}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
.wrap{position:relative;width:1024px;height:500px;background:linear-gradient(120deg,#FCF8ED 0%,#FFF1E6 50%,#FDE3DF 100%);font-family:Nunito}
.blob{position:absolute;border-radius:50%}
.text{position:absolute;left:72px;top:96px;width:560px;color:#38221F}
h1{font-family:Fraunces;font-weight:600;font-size:84px;margin:0;letter-spacing:-1px;line-height:1}
h1 span{color:#E04A40}
p{font-size:30px;line-height:1.3;margin:22px 0 34px;color:#52302D;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:17px;font-weight:800;padding:9px 15px;border-radius:999px}
.b{background:#FDD9DA;color:#7A2621}.p{background:#FED4B9;color:#5C2B13}.s{background:#C0DABB;color:#223A23}
.icon{position:absolute;right:92px;top:86px;width:328px;height:328px;border-radius:76px;overflow:hidden;box-shadow:0 24px 60px rgba(180,70,50,.25)}
.icon img{width:100%;height:100%;display:block}
</style></head><body><div class="wrap">
<div class="blob" style="width:540px;height:540px;right:-70px;top:-20px;background:#FDD9DA;opacity:.55"></div>
<div class="blob" style="width:200px;height:200px;right:430px;bottom:-95px;background:#FED4B9;opacity:.5"></div>
<div class="text">
<h1>Natal <span>IQ</span></h1>
<p>Your gentle companion through pregnancy &amp; early motherhood</p>
<div class="chips"><div class="chip b">AI companion</div><div class="chip p">Daily tracker</div><div class="chip s">Journal</div><div class="chip b">Community</div></div>
</div>
<div class="icon"><img src="icon.jpeg"></div>
</div></body></html>
