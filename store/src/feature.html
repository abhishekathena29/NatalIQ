<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fraunces;src:url(Fraunces.ttf)}
@font-face{font-family:Nunito;src:url(Nunito.ttf)}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
.wrap{position:relative;width:1024px;height:500px;background:linear-gradient(120deg,#FFF9F2 0%,#FFEDE0 45%,#FFDDD6 100%);font-family:Nunito}
.blob{position:absolute;border-radius:50%}
.text{position:absolute;left:72px;top:92px;width:560px;color:#38221F}
h1{font-family:Fraunces;font-weight:600;font-size:84px;margin:0;letter-spacing:-1px;line-height:1}
h1 span{color:#BF525A}
p{font-size:30px;line-height:1.3;margin:22px 0 34px;color:#52302D;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:17px;font-weight:800;padding:9px 15px;border-radius:999px}
.b{background:#FDC8CB;color:#61232B}.p{background:#FED4B9;color:#5C2B13}.s{background:#C0DABB;color:#223A23}
.icon{position:absolute;right:96px;top:90px;width:320px;height:320px;border-radius:72px;overflow:hidden;box-shadow:0 24px 60px rgba(180,90,60,.28)}
</style></head><body><div class="wrap">
<div class="blob" style="width:520px;height:520px;right:-60px;top:-10px;background:#FDC8CB;opacity:.45"></div>
<div class="blob" style="width:200px;height:200px;right:420px;bottom:-90px;background:#C0DABB;opacity:.5"></div>
<div class="text">
<h1>Natal <span>IQ</span></h1>
<p>Your gentle companion through pregnancy &amp; early motherhood</p>
<div class="chips"><div class="chip b">AI companion</div><div class="chip p">Daily tracker</div><div class="chip s">Journal</div><div class="chip b">Community</div></div>
</div>
<div class="icon"><svg width="320" height="320" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59AA1"/><stop offset="1" stop-color="#BF525A"/></linearGradient></defs>
<rect width="512" height="512" fill="url(#bg)"/>
<defs>
  <mask id="cres">
    <rect x="0" y="0" width="512" height="512" fill="white"/>
    <circle cx="292" cy="236" r="132" fill="black"/>
  </mask>
</defs>
<!-- crescent: the embrace -->
<circle cx="256" cy="268" r="160" fill="#FFF9F2" mask="url(#cres)"/>
<!-- baby -->
<circle cx="300" cy="262" r="62" fill="#FFF9F2"/>
<!-- sage leaf sprig -->
<path d="M344 152 C 372 112, 420 104, 440 110 C 432 136, 404 172, 356 170 Z" fill="#C0DABB"/>
<path d="M346 166 C 372 146, 400 132, 430 116" stroke="#9CC49C" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg></div>
</div></body></html>
